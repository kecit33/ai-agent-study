# Render Blueprint —— AI 校园学习陪伴助手 一键部署
#
# 用法（约 2 分钟）：
#   1. 把本仓库推送到 GitHub
#   2. Render 控制台 → New + → Blueprint → 连接该仓库
#   3. Render 自动读取本文件创建 Web Service，部署完成即生成 https://xxx.onrender.com
#
# 零依赖：server.py 仅使用 Python 标准库，buildCommand 无需安装任何包。
# 服务监听 Render 自动注入的 PORT 环境变量并绑定 0.0.0.0（server.py 已实现）。
# 未配置密钥时自动进入内置演示模式，师生可直接验收；密钥在 Environment 中可选添加。
services:
  - type: web
    name: ai-campus-companion
    env: python
    plan: free
    buildCommand: "echo 'zero-dependency runtime: skip pip install'"
    startCommand: "python server.py"
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ACTIVE_PROVIDER
        value: demo
