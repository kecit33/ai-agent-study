<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <rect width="1100" height="800" fill="#ffffff"/>
  <text x="1060" y="26" font-size="12" fill="#8a97ab" text-anchor="end">V1.5.0 类图（模块 / 实体关系）</text>

  <defs>
    <marker id="tri" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0 0 L10 0 L5 9 Z" fill="#41506a"/>
    </marker>
  </defs>

  <!-- 抽象基类 -->
  <rect x="370" y="40" width="330" height="96" rx="9" fill="#eaf1ff" stroke="#2f6fed" stroke-width="1.8"/>
  <text x="535" y="66" font-size="14" font-weight="700" fill="#1f2733" text-anchor="middle">&lt;&lt;abstract&gt;&gt; AgentProvider</text>
  <text x="386" y="88" font-size="11.5" fill="#41506a">+ name, label, strip_mode_marker</text>
  <text x="386" y="107" font-size="11.5" fill="#41506a">+ complete(sys, msgs) · is_available()</text>
  <text x="386" y="126" font-size="11.5" fill="#41506a">+ _call() · probe()   （异常统一降级）</text>

  <!-- 实现分叉 -->
  <g stroke="#41506a" stroke-width="1.4" fill="none">
    <path d="M535 136 L535 158"/>
    <path d="M160 158 L910 158"/>
    <path d="M160 158 L160 182"/><path d="M535 158 L535 182"/><path d="M910 158 L910 182"/>
    <path d="M160 232 L160 252"/><path d="M535 232 L535 252"/><path d="M910 232 L910 252"/>
    <path d="M160 158 L160 250"/><path d="M910 158 L910 250"/>
  </g>

  <!-- 6 个 Provider -->
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="182" width="240" height="48" rx="6" fill="#ffffff" stroke="#2f6fed"/>
    <text x="160" y="211" fill="#2f4d8a">OpenAIProvider（GPT）</text>
    <rect x="415" y="182" width="240" height="48" rx="6" fill="#ffffff" stroke="#2f6fed"/>
    <text x="535" y="211" fill="#2f4d8a">QianFanProvider（文心）</text>
    <rect x="790" y="182" width="240" height="48" rx="6" fill="#ffffff" stroke="#2f6fed"/>
    <text x="910" y="211" fill="#2f4d8a">MoonshotProvider（Kimi）</text>
    <rect x="40" y="252" width="240" height="48" rx="6" fill="#ffffff" stroke="#2f6fed"/>
    <text x="160" y="281" fill="#2f4d8a">ClaudeProvider</text>
    <rect x="415" y="252" width="240" height="48" rx="6" fill="#ffffff" stroke="#2f6fed"/>
    <text x="535" y="281" fill="#2f4d8a">CustomProvider（兼容端点）</text>
    <rect x="790" y="252" width="240" height="48" rx="6" fill="#fff3e0" stroke="#e08a00"/>
    <text x="910" y="281" fill="#a3650a">DemoProvider（无密钥兜底）</text>
  </g>

  <!-- 工厂 + 配置中心 -->
  <rect x="40" y="340" width="330" height="180" rx="9" fill="#f0ecff" stroke="#6b4fed"/>
  <text x="205" y="366" font-size="13.5" font-weight="700" fill="#1f2733" text-anchor="middle">ProviderFactory / credentials</text>
  <text x="56" y="390" font-size="11.5" fill="#41506a">_PROVIDERS = 6（注册表）</text>
  <text x="56" y="410" font-size="11.5" fill="#41506a">+ get_provider(name) → 不可用回退 demo</text>
  <text x="56" y="430" font-size="11.5" fill="#41506a">+ configure / clear / probe</text>
  <text x="56" y="450" font-size="11.5" fill="#41506a">+ direct_complete(...) → fallback 标记</text>
  <text x="56" y="474" font-size="11" fill="#5539b8">credentials: save / get / status（掩码）</text>
  <text x="56" y="494" font-size="11" fill="#5539b8">优先级：运行时 SQLite &gt; 环境变量 &gt; demo</text>

  <!-- 服务层 -->
  <rect x="410" y="340" width="330" height="180" rx="9" fill="#eaf7ef" stroke="#1aa260"/>
  <text x="575" y="366" font-size="13.5" font-weight="700" fill="#1f2733" text-anchor="middle">业务服务层 services（8 模块）</text>
  <text x="426" y="390" font-size="11.5" fill="#41506a">course · tasks · wrong_questions</text>
  <text x="426" y="410" font-size="11.5" fill="#41506a">files · focus · subject_knowledge</text>
  <text x="426" y="430" font-size="11.5" fill="#41506a">study · mindmap</text>
  <text x="426" y="454" font-size="11" fill="#1a6f48">uses ▸ AgentProvider（业务不感知厂商）</text>
  <text x="426" y="474" font-size="11" fill="#1a6f48">build_course_context() ≤ 12000 字</text>
  <text x="426" y="494" font-size="11" fill="#1a6f48">全部 SQL 参数化绑定</text>

  <!-- 数据实体 -->
  <rect x="780" y="340" width="290" height="300" rx="9" fill="#fff3e0" stroke="#e08a00"/>
  <text x="925" y="366" font-size="13.5" font-weight="700" fill="#1f2733" text-anchor="middle">数据实体 SQLite（8 张表）</text>
  <g font-size="11.5" fill="#41506a">
    <text x="796" y="392">courses（课程，隔离单元）</text>
    <text x="796" y="416">course_materials（资料全文）</text>
    <text x="796" y="440">conversations（对话历史）</text>
    <text x="796" y="464">wrong_questions（错因 / 掌握）</text>
    <text x="796" y="488">review_tasks（复习任务）</text>
    <text x="796" y="512">settings（激活 Provider / 专注）</text>
    <text x="796" y="536">focus_sessions（专注记录）</text>
    <text x="796" y="560">provider_credentials（密钥）</text>
  </g>
  <text x="796" y="592" font-size="11" fill="#a3650a">get_conn(): timeout=10 · busy_timeout=5000</text>
  <text x="796" y="614" font-size="11" fill="#a3650a">写入前显式校验课程存在（拒孤儿数据）</text>

  <!-- HTTP 入口 -->
  <rect x="410" y="560" width="330" height="100" rx="9" fill="#eaf1ff" stroke="#2f6fed"/>
  <text x="575" y="586" font-size="13.5" font-weight="700" fill="#1f2733" text-anchor="middle">server.py（唯一 HTTP 入口）</text>
  <text x="426" y="610" font-size="11.5" fill="#41506a">ThreadingHTTPServer · ROUTES 40 条</text>
  <text x="426" y="630" font-size="11.5" fill="#41506a">Download / Raw · multipart · 30s 调度</text>
  <text x="426" y="650" font-size="11" fill="#2f4d8a">零第三方依赖 · version.py 版本指纹</text>

  <!-- 前端 -->
  <rect x="40" y="560" width="330" height="100" rx="9" fill="#eaf1ff" stroke="#2f6fed"/>
  <text x="205" y="586" font-size="13.5" font-weight="700" fill="#1f2733" text-anchor="middle">前端 static/（10 个模块）</text>
  <text x="56" y="610" font-size="11.5" fill="#41506a">index.html · style.css · app.js</text>
  <text x="56" y="630" font-size="11.5" fill="#41506a">api() · esc() · renderMarkdown(b)</text>
  <text x="56" y="650" font-size="11" fill="#2f4d8a">escape-first Markdown · 键盘可达</text>

  <!-- 关系连线 -->
  <g stroke="#41506a" stroke-width="1.5" fill="none" marker-end="url(#tri)">
    <path d="M370 430 L408 430"/>
    <path d="M740 430 L778 430"/>
    <path d="M575 520 L575 558"/>
    <path d="M410 610 L372 610"/>
  </g>
  <g stroke="#9fb3d6" stroke-width="1.3" stroke-dasharray="5 4" fill="none">
    <path d="M205 340 C205 320 150 320 150 302"/>
    <path d="M205 560 C250 560 300 540 370 530"/>
    <path d="M740 610 C765 610 765 590 778 590"/>
  </g>
  <text x="535" y="700" font-size="11.5" fill="#6b7686" text-anchor="middle">实线：调用 / 依赖　　虚线：配置注入与数据读写</text>
  <text x="535" y="724" font-size="11.5" fill="#6b7686" text-anchor="middle">V1.3.0 起 Flask app.py 已移除，全系统只有 server.py 一个后端入口</text>
</svg>
