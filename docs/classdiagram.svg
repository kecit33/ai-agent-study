<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <rect width="1000" height="700" fill="#ffffff"/>

  <!-- 关系线 -->
  <g stroke="#41506a" stroke-width="1.6" fill="none">
    <path d="M250 250 L250 300" marker-end="url(#tri)"/>
    <path d="M120 250 L120 300"/>
    <path d="M380 250 L380 300"/>
    <path d="M510 250 L510 300"/>
    <path d="M640 250 L640 300"/>
    <path d="M250 175 L250 210"/>  <!-- AgentProvider 到抽象框 -->
    <path d="M250 360 L250 410"/>  <!-- AgentProvider 到工厂/服务 -->
    <path d="M250 470 L250 520"/>
    <path d="M760 250 L760 300"/>
  </g>
  <g stroke="#9fb3d6" stroke-width="1.4" stroke-dasharray="5 4" fill="none">
    <path d="M250 360 C400 360 400 360 470 360"/>
    <path d="M760 360 C650 360 650 360 600 360"/>
    <path d="M760 250 C700 250 700 250 660 250"/>
  </g>

  <defs>
    <marker id="tri" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0 0 L10 0 L5 9 Z" fill="#41506a"/>
    </marker>
  </defs>

  <!-- AgentProvider 抽象 -->
  <g>
    <rect x="150" y="285" width="200" height="80" rx="8" fill="#eaf1ff" stroke="#2f6fed"/>
    <text x="250" y="308" font-size="14" font-weight="700" fill="#1f2733" text-anchor="middle">&lt;&lt;abstract&gt;&gt; AgentProvider</text>
    <text x="160" y="330" font-size="11" fill="#41506a">+ name, label</text>
    <text x="160" y="348" font-size="11" fill="#41506a">+ complete(sys,msgs)</text>
    <text x="160" y="364" font-size="11" fill="#41506a">+ is_available()</text>
  </g>

  <!-- 四个实现 + Demo -->
  <g font-size="11" fill="#2f6fed">
    <rect x="20" y="300" width="150" height="35" rx="6" fill="#ffffff" stroke="#2f6fed"/>
    <text x="95" y="322" text-anchor="middle">OpenAIProvider</text>
    <rect x="310" y="300" width="150" height="35" rx="6" fill="#ffffff" stroke="#2f6fed"/>
    <text x="385" y="322" text-anchor="middle">QianFanProvider</text>
    <rect x="440" y="300" width="150" height="35" rx="6" fill="#ffffff" stroke="#2f6fed"/>
    <text x="515" y="322" text-anchor="middle">MoonshotProvider</text>
    <rect x="570" y="300" width="150" height="35" rx="6" fill="#ffffff" stroke="#2f6fed"/>
    <text x="645" y="322" text-anchor="middle">ClaudeProvider</text>
    <rect x="690" y="300" width="140" height="35" rx="6" fill="#fff3e0" stroke="#e08a00"/>
    <text x="760" y="322" text-anchor="middle">DemoProvider</text>
  </g>

  <!-- ProviderFactory -->
  <g>
    <rect x="150" y="365" width="200" height="95" rx="8" fill="#eaf1ff" stroke="#2f6fed"/>
    <text x="250" y="388" font-size="13" font-weight="700" fill="#1f2733" text-anchor="middle">ProviderFactory</text>
    <text x="160" y="408" font-size="10.5" fill="#41506a">+ get_provider()</text>
    <text x="160" y="424" font-size="10.5" fill="#41506a">+ get_active_provider_name()</text>
    <text x="160" y="440" font-size="10.5" fill="#41506a">+ set_active_provider()</text>
    <text x="160" y="456" font-size="10.5" fill="#41506a">+ list_providers_status()</text>
  </g>

  <!-- 服务层 -->
  <g>
    <rect x="430" y="345" width="220" height="155" rx="8" fill="#eaf7ef" stroke="#1aa260"/>
    <text x="540" y="368" font-size="13" font-weight="700" fill="#1f2733" text-anchor="middle">服务层 (services)</text>
    <text x="442" y="390" font-size="11" fill="#41506a">CourseService: 课程/资料/上下文</text>
    <text x="442" y="410" font-size="11" fill="#41506a">TaskService: 问答/总结/辅导/计划</text>
    <text x="442" y="430" font-size="11" fill="#41506a">WrongQuestionService: 错题/变式</text>
    <text x="442" y="450" font-size="11" fill="#41506a">HardwareService: 提醒下发</text>
    <text x="442" y="478" font-size="10.5" fill="#1aa260">uses ▸ AgentProvider（可插拔）</text>
  </g>

  <!-- 数据层 -->
  <g>
    <rect x="700" y="345" width="270" height="225" rx="8" fill="#fff3e0" stroke="#e08a00"/>
    <text x="835" y="368" font-size="13" font-weight="700" fill="#1f2733" text-anchor="middle">数据实体 (SQLite)</text>
    <text x="712" y="390" font-size="11" fill="#41506a">Course (id, name)</text>
    <text x="712" y="410" font-size="11" fill="#41506a">CourseMaterial (course_id,content)</text>
    <text x="712" y="430" font-size="11" fill="#41506a">Conversation (course_id,role,text)</text>
    <text x="712" y="450" font-size="11" fill="#41506a">WrongQuestion (course_id,reason)</text>
    <text x="712" y="470" font-size="11" fill="#41506a">ReviewTask (due_time,notified)</text>
    <text x="712" y="490" font-size="11" fill="#41506a">Setting (active_provider)</text>
  </g>

  <!-- Flask App -->
  <g>
    <rect x="430" y="520" width="270" height="70" rx="8" fill="#f0ecff" stroke="#6b4fed"/>
    <text x="565" y="545" font-size="13" font-weight="700" fill="#1f2733" text-anchor="middle">Flask App (app.py)</text>
    <text x="442" y="567" font-size="11" fill="#41506a">REST 路由 · CORS · 静态资源 · 调度</text>
  </g>

  <!-- 前端 -->
  <g>
    <rect x="60" y="540" width="300" height="70" rx="8" fill="#eaf1ff" stroke="#2f6fed"/>
    <text x="210" y="565" font-size="13" font-weight="700" fill="#1f2733" text-anchor="middle">前端 (HTML/CSS/JS)</text>
    <text x="72" y="587" font-size="11" fill="#41506a">8 个功能模块 · 调用 REST API</text>
  </g>
  <g stroke="#9fb3d6" stroke-width="1.4" stroke-dasharray="5 4" fill="none">
    <path d="M360 575 C400 575 400 555 430 555"/>
  </g>

  <text x="250" y="200" font-size="12" fill="#6b7686" text-anchor="middle">「实现」</text>
  <text x="250" y="500" font-size="12" fill="#6b7686" text-anchor="middle">「创建/返回」</text>
</svg>
