<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <rect width="1100" height="760" fill="#ffffff"/>
  <text x="1060" y="28" font-size="12" fill="#8a97ab" text-anchor="end">V1.5.0 功能需求思维导图</text>

  <!-- 主干连线 -->
  <g stroke="#9fb3d6" stroke-width="2" fill="none">
    <path d="M240 380 C285 380 285 72 330 72"/>
    <path d="M240 380 C285 380 285 192 330 192"/>
    <path d="M240 380 C285 380 285 312 330 312"/>
    <path d="M240 380 C285 380 285 432 330 432"/>
    <path d="M240 380 C285 380 285 552 330 552"/>
    <path d="M240 380 C285 380 285 672 330 672"/>
  </g>

  <!-- 中心节点 -->
  <rect x="40" y="330" width="200" height="100" rx="16" fill="#2f6fed"/>
  <text x="140" y="366" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">AI 校园</text>
  <text x="140" y="392" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">学习陪伴助手</text>
  <text x="140" y="414" font-size="11" fill="#dbe7ff" text-anchor="middle">V1.5.0 · 验收基线</text>

  <!-- 分支 1 -->
  <rect x="330" y="30" width="250" height="84" rx="10" fill="#eaf1ff" stroke="#2f6fed"/>
  <text x="455" y="60" font-size="15" font-weight="700" fill="#1f2733" text-anchor="middle">核心学习功能</text>
  <text x="455" y="86" font-size="11.5" fill="#41506a" text-anchor="middle">F01 – F04 · 课程内基础能力</text>
  <g font-size="12.5" fill="#2f4d8a">
    <text x="610" y="52">• 课程记忆智能问答（按课程隔离）</text>
    <text x="610" y="74">• 课件总结：知识点 + 考点提纲</text>
    <text x="610" y="96">• 引导式辅导 / 逐日复习计划</text>
  </g>

  <!-- 分支 2 -->
  <rect x="330" y="150" width="250" height="84" rx="10" fill="#eaf1ff" stroke="#2f6fed"/>
  <text x="455" y="180" font-size="15" font-weight="700" fill="#1f2733" text-anchor="middle">杀手级功能</text>
  <text x="455" y="206" font-size="11.5" fill="#41506a" text-anchor="middle">F05 – F11 · 记忆与错题闭环</text>
  <g font-size="12.5" fill="#2f4d8a">
    <text x="610" y="172">• 课程记忆：上传即入，12000 字预算</text>
    <text x="610" y="194">• 资料「查看全文 / 收起」「下载 .md」</text>
    <text x="610" y="216">• 错题录入 → 错因 → 变式题 → 掌握</text>
  </g>

  <!-- 分支 3 -->
  <rect x="330" y="270" width="250" height="84" rx="10" fill="#eaf7ef" stroke="#1aa260"/>
  <text x="455" y="300" font-size="15" font-weight="700" fill="#1f2733" text-anchor="middle">学习资源包</text>
  <text x="455" y="326" font-size="11.5" fill="#41506a" text-anchor="middle">F13 – F19 · 高数上册 7 章</text>
  <g font-size="12.5" fill="#1a6f48">
    <text x="610" y="292">• 28 道带标准答案与解析的自测题</text>
    <text x="610" y="314">• 复习总结 / 专题文章 / 资料清单</text>
    <text x="610" y="336">• 思维导图（SVG·大纲·Mermaid）、全套导出</text>
  </g>

  <!-- 分支 4 -->
  <rect x="330" y="390" width="250" height="84" rx="10" fill="#f0ecff" stroke="#6b4fed"/>
  <text x="455" y="420" font-size="15" font-weight="700" fill="#1f2733" text-anchor="middle">可插拔智能体</text>
  <text x="455" y="446" font-size="11.5" fill="#41506a" text-anchor="middle">F20 – F23 · 嵌入业务层</text>
  <g font-size="12.5" fill="#5539b8">
    <text x="610" y="412">• 6 个 Provider：GPT/文心/Kimi/Claude/自定义/演示</text>
    <text x="610" y="434">• 运行时密钥（掩码）、探针、模型透传</text>
    <text x="610" y="456">• 业务层只依赖 AgentProvider，失败自动回退</text>
  </g>

  <!-- 分支 5 -->
  <rect x="330" y="510" width="250" height="84" rx="10" fill="#eaf1ff" stroke="#2f6fed"/>
  <text x="455" y="540" font-size="15" font-weight="700" fill="#1f2733" text-anchor="middle">体验与健壮性</text>
  <text x="455" y="566" font-size="11.5" fill="#41506a" text-anchor="middle">F24 – F36 · 前三轮自查成果</text>
  <g font-size="12.5" fill="#2f4d8a">
    <text x="610" y="532">• 深浅色三档 / 6 套主题色 / 语音输入 5 处</text>
    <text x="610" y="554">• 安全 Markdown、忙碌态、键盘可达</text>
    <text x="610" y="576">• 异常降级、XSS 转义、孤儿数据拦截、竞态防护</text>
  </g>

  <!-- 分支 6 -->
  <rect x="330" y="630" width="250" height="84" rx="10" fill="#fff3e0" stroke="#e08a00"/>
  <text x="455" y="660" font-size="15" font-weight="700" fill="#1f2733" text-anchor="middle">硬件联动（可选·未实机）</text>
  <text x="455" y="686" font-size="11.5" fill="#41506a" text-anchor="middle">F37 · 不作验收项</text>
  <g font-size="12.5" fill="#a3650a">
    <text x="610" y="652">• 下行：到点提醒 / 手动测试 / 专注灯</text>
    <text x="610" y="674">• 上行：学习状态看板（6 个交互点）</text>
    <text x="610" y="696">• 固件与接口齐备，LED / 蜂鸣器未实机联调</text>
  </g>

  <g stroke="#cdd9ee" stroke-width="1.5" fill="none">
    <path d="M580 72 L600 72"/><path d="M580 192 L600 192"/><path d="M580 312 L600 312"/>
    <path d="M580 432 L600 432"/><path d="M580 552 L600 552"/><path d="M580 672 L600 672"/>
  </g>
</svg>
