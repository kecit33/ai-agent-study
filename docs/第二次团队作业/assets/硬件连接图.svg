ocus/state</text><rect x="610" y="100" width="160" height="96" rx="8" fill="#FFFBF2" stroke="#D9A441" stroke-width="1.4"/><text x="690" y="130" font-size="13" text-anchor="middle" font-weight="bold" fill="#B45309" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >Wi-Fi / HTTP</text><text x="690" y="152" font-size="11" text-anchor="middle" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >ESP32_ENDPOINT</text><text x="690" y="172" font-size="11" text-anchor="middle" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >Webhook 双向</text><rect x="820" y="100" width="150" height="96" rx="8" fill="#FFFFFF" stroke="#2F6FED" stroke-width="1.4"/><text x="895" y="130" font-size="13" text-anchor="middle" font-weight="bold" fill="#1B3A78" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >ESP32 固件</text><text x="895" y="152" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >esp32_firmware.ino</text><text x="895" y="172" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >监听 /remind /focus</text><line x1="250" y1="148" x2="300" y2="148" stroke="#7C93BF" stroke-width="1.4" marker-end="url(#ar)"/><text x="275" y="138" font-size="11" text-anchor="middle" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >REST</text><line x1="550" y1="148" x2="610" y2="148" stroke="#7C93BF" stroke-width="1.4" marker-end="url(#ar)"/><text x="580" y="138" font-size="11" text-anchor="middle" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >下行</text><line x1="770" y1="148" x2="820" y2="148" stroke="#7C93BF" stroke-width="1.4" marker-end="url(#ar)"/><text x="795" y="138" font-size="11" text-anchor="middle" font-we