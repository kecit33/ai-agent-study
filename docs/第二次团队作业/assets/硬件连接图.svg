t YaHei, PingFang SC, SimHei, sans-serif" >LED（板载可替代）</text><text x="346" y="294" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >GPIO 2 → 限流电阻 → GND</text><line x1="270" y1="278" x2="330" y2="278" stroke="#7C93BF" stroke-width="1.4" marker-end="url(#ar)"/><text x="300" y="268" font-size="11" text-anchor="middle" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >GPIO 2</text><rect x="330" y="314" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#2F6FED" stroke-width="1.4"/><text x="346" y="336" font-size="12" text-anchor="start" font-weight="bold" fill="#1B3A78" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >有源蜂鸣器</text><text x="346" y="356" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >GPIO 4 → +；− → GND</text><line x1="270" y1="340" x2="330" y2="340" stroke="#7C93BF" stroke-width="1.4" marker-end="url(#ar)"/><text x="300" y="330" font-size="11" text-anchor="middle" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >GPIO 4</text><rect x="330" y="376" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#D9A441" stroke-width="1.4" stroke-dasharray="4 3"/><text x="346" y="398" font-size="12" text-anchor="start" font-weight="bold" fill="#B45309" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >OLED（可选 · 固件未实现）</text><text x="346" y="418" font-size="11" text-anchor="start" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >I2C SDA / SCL 待确认</text><line x1="270" y1="402" x2="330" y2="402" stroke="#7C93BF" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="300" y="392" font-size="11" text-anchor="middle" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, san