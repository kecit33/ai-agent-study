rif" >PK  id INTEGER</text><text x="752" y="133" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >FK  course_id INTEGER（可空）</text><text x="752" y="150" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >    task_name / due_time</text><text x="752" y="167" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >    notified / created_at</text><rect x="740" y="226" width="268" height="128" rx="6" fill="#FFFFFF" stroke="#2F6FED" stroke-width="1.6"/><rect x="740" y="226" width="268" height="30" rx="6" fill="#EEF4FF" stroke="#2F6FED" stroke-width="1.2"/><text x="874.0" y="246" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1B3A78" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >FocusSession / focus_sessions</text><text x="752" y="276" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >PK  id INTEGER</text><text x="752" y="293" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >FK  course_id INTEGER（可空）</text><text x="752" y="310" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >    minutes / note</text><text x="752" y="327" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >    started_at / ended_at</text><rect x="50" y="430" width="250" height="118" rx="6" fill="#FFFFFF" stroke="#2F6FED" stroke-width="1.6"/><rect x="50" y="430" width="250" height="30" rx="6" fill="#EEF4FF" stroke="#2F6FED" stroke-width="1.2"/><text x="175.0" y="450" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1B3A78" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >Setting / settings</text><text x="62" y="480" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >PK  key TEXT</text><text x="62" y="497" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >    value TEXT</text><text x="62" y="514" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >active_provider / focus_active</text><rect x="740" y="430" width="268" height="118" rx="6" fill="#FFFFFF" stroke="#2F6FED" stroke-width="1.6"/><rect x="740" y="430" width="268" height="30" rx="6" fill="#EEF4FF" stroke="#2F6FED" stroke-width="1.2"/><text x="874.0" y="450" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1B3A78" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >ProviderCredential / provider_credentials</text><text x="752" y="480" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >PK  provider TEXT</text><text x="752" y="497" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >    data TEXT（JSON）</text><text x="752" y="514" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >    updated_at TEXT</text><line x1="300" y1="144" x2="390" y2="140" stroke="#7C93BF" stroke-width="1.4" marker-end="url(#ar)"/><text x="345" y="130" font-size="11" text-anchor="middle" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >所属 1 : N</text><line x1="300" y1="144" x2="390" y2="300" stroke="#7C93BF" stroke-width="1.4" marker-end="url(#ar)"/><text x="345" y="250" font-size="11" text-anchor="middle" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >记录 1 : N</text><line x1="300" y1="144" x2="390" y2="462" stroke="#7C93BF" stroke-width="1.4" marker-end="url(#ar)"/><text x="345" y="390" font-size="11" text-anchor="middle" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >归属 1 : N</text><line x1="648" y1="140" x2="740" y2="140" stroke="#7C93BF" stroke-width="1.4" marker-end="url(#ar)"/><text x="694" y="128" font-size="11" text-anchor="middle" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >1 : N</text><line x1="648" y1="290" x2="740" y2="276" stroke="#7C93BF" stroke-width="1.4" marker-end="url(#ar)"/><text x="694" y="270" font-size="11" text-anchor="middle" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >1 : N</text><text x="24" y="600" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >独立实体：settings（全局键值配置）与 provider_credentials（运行时模型密钥）不与课程建立外键联系。</text><text x="24" y="624" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >完整性说明：SQLite 默认未启用外键约束；course_materials 与 wrong_questions 由业务层显式校验课程存在性，拒绝孤儿数据（F32 / A35）。</text><text x="24" y="648" font-size="12.5" text-anchor="start" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >全部 SQL 使用参数绑定；review_tasks.course_id 与 focus_sessions.course_id 允许为空。</text><text x="24" y="700" font-size="12" text-anchor="start" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >约定：PK 主键 · FK 外键 · UK 唯一约束；「1 : N」表示一门课程对多条子记录。</text><text x="24" y="782" font-size="12" text-anchor="start" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >无言以对 · 第二次团队作业 · 原型设计+概要设计</text></svg>