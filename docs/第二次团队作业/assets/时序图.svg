oke-width="1.1" stroke-dasharray="4 4"/><rect x="1028" y="56" width="144" height="48" rx="6" fill="#EEF4FF" stroke="#2F6FED" stroke-width="1.4"/><text x="1100" y="76" font-size="12" text-anchor="middle" font-weight="bold" fill="#1B3A78" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >DemoProvider</text><text x="1100" y="93" font-size="12" text-anchor="middle" font-weight="bold" fill="#1B3A78" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >/ 厂商</text><line x1="1100" y1="104" x2="1100" y2="780" stroke="#C7D7F5" stroke-width="1.1" stroke-dasharray="4 4"/><line x1="70" y1="132" x2="220" y2="132" stroke="#7C93BF" stroke-width="1.5" marker-end="url(#ar)"/><text x="145.0" y="124" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >① 选择课程并输入提问</text><line x1="220" y1="176" x2="370" y2="176" stroke="#7C93BF" stroke-width="1.5" marker-end="url(#ar)"/><text x="295.0" y="168" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >② POST /api/chat {course_id, message}</text><line x1="370" y1="220" x2="520" y2="220" stroke="#7C93BF" stroke-width="1.5" marker-end="url(#ar)"/><text x="445.0" y="212" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >③ 路由分发 chat()</text><line x1="520" y1="264" x2="670" y2="264" stroke="#7C93BF" stroke-width="1.5" marker-end="url(#ar)"/><text x="595.0" y="256" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >④ build_course_context(course_id)</text><line x1="670" y1="308" x2="820" y2="308" stroke="#7C93BF" stroke-width="1.5" marker-end="url(#ar)"/><text x="745.0" y="300" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >⑤ SELECT ... WHERE course_id = ?</text><line x1="820" y1="352" x2="670" y2="352" stroke="#7C93BF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="745.0" y="344" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >⑥ 返回课程资料行集</text><line x1="670" y1="396" x2="520" y2="396" stroke="#7C93BF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="595.0" y="388" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >⑦ system prompt（单份 4000 / 总 12000 字，超预算提示）</text><line x1="520" y1="440" x2="970" y2="440" stroke="#7C93BF" stroke-width="1.5" marker-end="url(#ar)"/><text x="745.0" y="432" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >⑧ complete(system_prompt, messages)</text><rect x="905" y="468" width="235" height="142" rx="6" fill="#FBFCFF" stroke="#9AAEDB" stroke-width="1.2"/><text x="1022" y="488" font-size="12" text-anchor="middle" font-weight="bold" fill="#1B3A78" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >«alt» 模型可用性</text><line x1="905" y1="500" x2="1140" y2="500" stroke="#9AAEDB" stroke-width="1"/><text x="915" y="522" font-size="11" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >有密钥：厂商 HTTP 调用</text><line x1="905" y1="536" x2="1140" y2="536" stroke="#9AAEDB" stroke-width="1" stroke-dasharray="4 3"/><text x="915" y="558" font-size="11" text-anchor="start" font-weight="normal" fill="#B45309" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >无密钥 / 异常：自动回退</text><text x="915" y="576" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >响应带 fallback 标记（C05 / F23）</text><line x1="970" y1="546" x2="520" y2="546" stroke="#7C93BF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="745.0" y="538" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >⑨ 回复文本（或降级文案）</text><line x1="520" y1="590" x2="820" y2="590" stroke="#7C93BF" stroke-width="1.5" marker-end="url(#ar)"/><text x="670.0" y="582" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >⑩ INSERT conversations（参数绑定）</text><line x1="820" y1="634" x2="520" y2="634" stroke="#7C93BF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="670.0" y="626" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >⑪ 写入完成</text><line x1="520" y1="678" x2="370" y2="678" stroke="#7C93BF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="445.0" y="670" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >⑫ JSON 响应 {reply, provider, fallback}</text><line x1="370" y1="722" x2="220" y2="722" stroke="#7C93BF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="295.0" y="714" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >⑬ 200 + application/json</text><line x1="220" y1="766" x2="70" y2="766" stroke="#7C93BF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="145.0" y="758" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >⑭ 安全 Markdown 渲染并展示（F27 / F31）</text><text x="24" y="810" font-size="12" text-anchor="start" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >说明：虚线为返回消息；alt 片段对应约束 C05「无密钥可运行」；业务层只依赖 AgentProvider 抽象（C03）。</text><text x="24" y="852" font-size="12" text-anchor="start" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >无言以对 · 第二次团队作业 · 原型设计+概要设计</text></svg>