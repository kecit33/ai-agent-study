 SimHei, sans-serif" >db.py</text><text x="686" y="411" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >SQLite data/companion.db（8 张表）· 参数绑定</text><text x="686" y="430" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >busy_timeout</text><rect x="60" y="478" width="880" height="72" rx="8" fill="#FFFBF2" stroke="#D9A441" stroke-width="1.5"/><rect x="60" y="478" width="170" height="72" rx="8" fill="#FFF1D6" stroke="#C7D7F5" stroke-width="1.2"/><text x="145" y="519.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1B3A78" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >可选硬件层</text><text x="246" y="504" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >hardware/esp32.py</text><text x="246" y="523" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >esp32_firmware.ino</text><text x="246" y="542" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >ESP32_ENDPOINT（未实机联调，不列入验收）</text><line x1="500" y1="142" x2="500" y2="162" stroke="#2F6FED" stroke-width="1.8" marker-end="url(#ar)"/><line x1="500" y1="234" x2="500" y2="254" stroke="#2F6FED" stroke-width="1.8" marker-end="url(#ar)"/><line x1="500" y1="346" x2="500" y2="366" stroke="#2F6FED" stroke-width="1.8" marker-end="url(#ar)"/><line x1="500" y1="458" x2="500" y2="478" stroke="#2F6FED" stroke-width="1.8" marker-end="url(#ar)"/><text x="24" y="578" font-size="12" text-anchor="start" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >侧路：后台守护线程每 30 秒 check_due_tasks()；/api/status 暴露版本指纹；静态资源由 Handler 单独分支返回。</text><text x="24" y="586" font-size="12" text-anchor="start" font-weight="normal" fill="#5B6B8C" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >无言以对 · 第二次团队作业 · 原型设计+概要设计</text></svg>