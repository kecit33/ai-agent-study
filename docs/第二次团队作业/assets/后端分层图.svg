-serif" >server.py：ThreadingHTTPServer</text><text x="246" y="207" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >Handler</text><text x="246" y="226" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >ROUTES 正则表（40 条 /api/*）· multipart</text><text x="246" y="245" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >Download / Raw</text><rect x="60" y="254" width="880" height="92" rx="8" fill="#FFFFFF" stroke="#2F6FED" stroke-width="1.5"/><rect x="60" y="254" width="170" height="92" rx="8" fill="#EEF4FF" stroke="#C7D7F5" stroke-width="1.2"/><text x="145" y="305.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1B3A78" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >业务服务层（8 模块）</text><text x="246" y="280" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >course</text><text x="246" y="299" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >tasks</text><text x="246" y="318" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >wrong_questions</text><text x="246" y="337" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >files</text><text x="246" y="356" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif" >focus</text><text x="246" y="375" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2937" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-s